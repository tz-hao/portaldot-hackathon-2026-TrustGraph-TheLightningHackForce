<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SovereignGraph - 完整 DApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 20px; }
        
        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #374151;
            margin-bottom: 16px;
            border-left: 4px solid #667eea;
            padding-left: 12px;
        }
        
        /* 钱包状态 */
        .wallet-status {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .address {
            font-family: monospace;
            background: #1e1e2e;
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        button:hover { background: #5a67d8; transform: translateY(-1px); }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .btn-secondary { background: #6b7280; }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        
        /* 表单 */
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        
        /* 图谱展示 */
        .graph-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value { font-size: 28px; font-weight: bold; }
        .node-list { display: flex; flex-wrap: wrap; gap: 12px; }
        .node-item {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 10px;
            flex: 1;
            min-width: 200px;
        }
        .loading { text-align: center; padding: 40px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tx-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e1e2e;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕸️ SovereignGraph - 主权信任图谱</h1>
        
        <!-- 钱包连接卡片 -->
        <div class="card">
            <h2>🔗 钱包连接</h2>
            <div class="wallet-status">
                <div>
                    <div id="walletStatus">未连接</div>
                    <div id="walletAddress" class="address" style="margin-top: 8px;"></div>
                </div>
                <div>
                    <button id="connectBtn" onclick="connectWallet()">连接 Polkadot 钱包</button>
                    <button id="disconnectBtn" onclick="disconnectWallet()" style="display:none;" class="btn-secondary">断开</button>
                </div>
            </div>
        </div>
        
        <!-- 合约交互卡片 -->
        <div class="card">
            <h2>📝 合约交互</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <!-- 注册身份 -->
                <div>
                    <h3 style="margin-bottom: 12px;">✨ 注册身份 (SBT)</h3>
                    <div class="form-group">
                        <label>IPFS CID (头像/资料)</label>
                        <input type="text" id="ipfsCid" placeholder="Qm..." value="QmTest123">
                    </div>
                    <button id="registerBtn" onclick="registerIdentity()" disabled>注册身份</button>
                </div>
                
                <!-- 发起背书 -->
                <div>
                    <h3 style="margin-bottom: 12px;">🤝 发起背书</h3>
                    <div class="form-group">
                        <label>目标地址</label>
                        <input type="text" id="targetAddress" placeholder="5...">
                    </div>
                    <button id="endorseBtn" onclick="createEndorsement()" disabled>发起背书</button>
                </div>
            </div>
        </div>
        
        <!-- 图谱查询卡片 -->
        <div class="card">
            <h2>🕸️ 知识图谱</h2>
            <div style="display: flex; gap: 12px; margin-bottom: 20px;">
                <button onclick="loadGraph()">刷新图谱</button>
                <button onclick="loadStats()" class="btn-secondary">刷新统计</button>
            </div>
            
            <div id="graphStats" class="graph-stats"></div>
            <div id="graphNodes"></div>
            <div id="graphEdges"></div>
            <div id="graphLoading" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>加载图谱数据...</p>
            </div>
        </div>
    </div>
    
    <div id="txStatus" class="tx-status" style="display:none;"></div>
    
    <script src="https://unpkg.com/@polkadot/api@latest/bundle.js"></script>
    <script>
        // 配置
        const BACKEND_URL = 'http://localhost:3000';
        const CONTRACT_ADDRESS = '5CaqSN11X9WmHvjT9MyVnbMuMTwDfAqqck63hJ1UWXvY4UgC';
        
        // 全局变量
        let api = null;
        let walletAddress = null;
        
        // 显示交易状态
        function showTxStatus(message, isError = false) {
            const statusDiv = document.getElementById('txStatus');
            statusDiv.textContent = message;
            statusDiv.style.background = isError ? '#ef4444' : '#10b981';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }
        
        // 连接钱包
        async function connectWallet() {
            try {
                if (typeof window.injectedWeb3 === 'undefined') {
                    alert('请安装 Polkadot.js 插件');
                    return;
                }
                
                // 获取可用的钱包
                const extensions = Object.keys(window.injectedWeb3);
                if (extensions.length === 0) {
                    alert('没有找到钱包扩展');
                    return;
                }
                
                // 连接到钱包
                const injected = await window.injectedWeb3[extensions[0]].enable('SovereignGraph');
                api = await ApiPromise.create({ provider: new WsProvider('wss://porcini.portalto.network') });
                
                // 获取账户
                const accounts = await injected.accounts.get();
                if (accounts.length === 0) {
                    alert('没有找到账户');
                    return;
                }
                
                walletAddress = accounts[0].address;
                document.getElementById('walletStatus').innerHTML = '✅ 已连接';
                document.getElementById('walletAddress').innerHTML = walletAddress;
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'inline-block';
                document.getElementById('registerBtn').disabled = false;
                document.getElementById('endorseBtn').disabled = false;
                
                showTxStatus('钱包已连接: ' + walletAddress.substring(0, 10) + '...');
                
            } catch (error) {
                console.error(error);
                alert('连接失败: ' + error.message);
            }
        }
        
        // 断开钱包
        function disconnectWallet() {
            api = null;
            walletAddress = null;
            document.getElementById('walletStatus').innerHTML = '未连接';
            document.getElementById('walletAddress').innerHTML = '';
            document.getElementById('connectBtn').style.display = 'inline-block';
            document.getElementById('disconnectBtn').style.display = 'none';
            document.getElementById('registerBtn').disabled = true;
            document.getElementById('endorseBtn').disabled = true;
            showTxStatus('钱包已断开');
        }
        
        // 注册身份 (调用合约)
        async function registerIdentity() {
            if (!api || !walletAddress) {
                alert('请先连接钱包');
                return;
            }
            
            const cid = document.getElementById('ipfsCid').value;
            if (!cid) {
                alert('请输入 IPFS CID');
                return;
            }
            
            showTxStatus('正在提交注册交易...');
            
            try {
                // 这里需要根据实际合约 ABI 构建交易
                // 简化示例：
                const tx = api.tx.contracts.call(
                    CONTRACT_ADDRESS,
                    0,
                    { Register: { cid: cid } }
                );
                
                await tx.signAndSend(walletAddress, (result) => {
                    if (result.status.isInBlock) {
                        showTxStatus('✅ 身份注册成功！区块: ' + result.status.asInBlock);
                        loadGraph(); // 刷新图谱
                    } else if (result.status.isFinalized) {
                        showTxStatus('✅ 交易已确认');
                    }
                });
            } catch (error) {
                console.error(error);
                showTxStatus('❌ 注册失败: ' + error.message, true);
            }
        }
        
        // 发起背书 (调用合约)
        async function createEndorsement() {
            if (!api || !walletAddress) {
                alert('请先连接钱包');
                return;
            }
            
            const target = document.getElementById('targetAddress').value;
            if (!target) {
                alert('请输入目标地址');
                return;
            }
            
            showTxStatus('正在提交背书交易...');
            
            try {
                const tx = api.tx.contracts.call(
                    CONTRACT_ADDRESS,
                    0,
                    { Endorse: { target: target } }
                );
                
                await tx.signAndSend(walletAddress, (result) => {
                    if (result.status.isInBlock) {
                        showTxStatus('✅ 背书成功！区块: ' + result.status.asInBlock);
                        loadGraph();
                    }
                });
            } catch (error) {
                console.error(error);
                showTxStatus('❌ 背书失败: ' + error.message, true);
            }
        }
        
        // 从后端加载图谱数据
        async function loadGraph() {
            const loadingDiv = document.getElementById('graphLoading');
            loadingDiv.style.display = 'block';
            
            try {
                const response = await fetch(BACKEND_URL + '/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `{
                            knowledgeGraph {
                                nodes {
                                    address
                                    ipfsCid
                                    inDegree
                                    outDegree
                                    totalScore
                                }
                                edges {
                                    fromAddress
                                    toAddress
                                    feePaid
                                }
                                stats {
                                    totalNodes
                                    totalEdges
                                    maxInDegree
                                    maxOutDegree
                                    highestScoreNode
                                }
                            }
                        }`
                    })
                });
                
                const result = await response.json();
                const data = result.data?.knowledgeGraph;
                
                if (data) {
                    // 渲染统计
                    renderStats(data.stats);
                    // 渲染节点
                    renderNodes(data.nodes);
                    // 渲染边
                    renderEdges(data.edges);
                }
                
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('graphStats').innerHTML = '<div style="color:red;">加载失败，请确保后端服务已启动</div>';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }
        
        // 仅加载统计
        async function loadStats() {
            try {
                const response = await fetch(BACKEND_URL + '/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `{ graphStats { totalNodes totalEdges maxInDegree maxOutDegree highestScoreNode } }`
                    })
                });
                const result = await response.json();
                renderStats(result.data?.graphStats);
            } catch (error) {
                console.error(error);
            }
        }
        
        function renderStats(stats) {
            if (!stats) return;
            document.getElementById('graphStats').innerHTML = `
                <div class="stat-box"><div class="stat-value">${stats.totalNodes}</div><div>总节点数</div></div>
                <div class="stat-box"><div class="stat-value">${stats.totalEdges}</div><div>总关系数</div></div>
                <div class="stat-box"><div class="stat-value">${stats.maxInDegree || 0}</div><div>最大入度</div></div>
                <div class="stat-box"><div class="stat-value">${stats.maxOutDegree || 0}</div><div>最大出度</div></div>
            `;
        }
        
        function renderNodes(nodes) {
            if (!nodes || nodes.length === 0) {
                document.getElementById('graphNodes').innerHTML = '<p>暂无身份节点</p>';
                return;
            }
            
            let html = '<h3>👥 身份节点</h3><div class="node-list">';
            for (const node of nodes) {
                html += `
                    <div class="node-item">
                        <div><strong>地址:</strong> ${node.address.substring(0, 20)}...</div>
                        <div><strong>IPFS:</strong> ${node.ipfsCid}</div>
                        <div><strong>信任分:</strong> ${node.totalScore}</div>
                        <div><strong>发出:</strong> ${node.outDegree} | <strong>收到:</strong> ${node.inDegree}</div>
                    </div>
                `;
            }
            html += '</div>';
            document.getElementById('graphNodes').innerHTML = html;
        }
        
        function renderEdges(edges) {
            if (!edges || edges.length === 0) {
                document.getElementById('graphEdges').innerHTML = '<p>暂无信任关系</p>';
                return;
            }
            
            let html = '<h3>🔗 信任关系</h3><div class="node-list">';
            for (const edge of edges) {
                html += `
                    <div class="node-item">
                        <div><strong>从:</strong> ${edge.fromAddress.substring(0, 16)}...</div>
                        <div><strong>到:</strong> ${edge.toAddress.substring(0, 16)}...</div>
                        <div><strong>质押:</strong> ${edge.feePaid} POT</div>
                    </div>
                `;
            }
            html += '</div>';
            document.getElementById('graphEdges').innerHTML = html;
        }
        
        // 页面加载时自动加载图谱
        document.addEventListener('DOMContentLoaded', () => {
            loadGraph();
            
            // 每30秒自动刷新
            setInterval(loadGraph, 30000);
        });
    </script>
</body>
</html>
