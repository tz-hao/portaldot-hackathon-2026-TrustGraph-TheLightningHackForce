<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SovereignGraph - 完整DApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 20px; }
        h3 { margin-bottom: 12px; color: #374151; }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #374151;
            margin-bottom: 16px;
            border-left: 4px solid #667eea;
            padding-left: 12px;
        }
        
        .wallet-status {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .address {
            font-family: monospace;
            background: #1e1e2e;
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            word-break: break-all;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        button:hover { background: #5a67d8; transform: translateY(-1px); }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .btn-secondary { background: #6b7280; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #374151; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .graph-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value { font-size: 28px; font-weight: bold; }
        
        .node-list, .edge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }
        .node-item, .edge-item {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 10px;
            flex: 1;
            min-width: 200px;
        }
        .edge-item { background: #eef2ff; }
        
        .loading { text-align: center; padding: 40px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tx-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e1e2e;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 1000;
        }
        .demo-badge {
            background: #f59e0b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-left: 12px;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .two-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕸️ SovereignGraph - 主权信任图谱 <span class="demo-badge">演示版</span></h1>
        
        <!-- 说明卡片 -->
        <div class="card">
            <h2>📖 使用说明</h2>
            <div style="color: #6b7280; line-height: 1.6;">
                <p>✅ <strong>模拟钱包模式</strong>：无需安装任何钱包插件，数据直接存储到后端数据库</p>
                <p>✅ <strong>注册身份</strong>：选择一个地址，输入 IPFS CID，点击注册</p>
                <p>✅ <strong>发起背书</strong>：选择发起方和目标地址，设置质押金额，点击发起</p>
                <p>✅ <strong>刷新图谱</strong>：查看所有身份节点和信任关系</p>
                <p>🔗 <strong>后端 API</strong>：http://localhost:3000/graphql</p>
            </div>
        </div>
        
        <!-- 合约交互卡片 -->
        <div class="card">
            <h2>📝 合约交互 (模拟模式)</h2>
            <div class="two-columns">
                <div>
                    <h3>✨ 注册身份 (SBT)</h3>
                    <div class="form-group">
                        <label>选择地址 (模拟不同用户)</label>
                        <select id="senderAddress">
                            <option value="5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY">用户 A (5Grwva...)</option>
                            <option value="5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694">用户 B (5FHneW...)</option>
                            <option value="5FLSigC9HGRKVhB9FiEo4Y3koPsNmBmLJbpXg2mp1hXcS59Y">用户 C (5FLSig...)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>IPFS CID (头像/资料)</label>
                        <input type="text" id="ipfsCid" placeholder="Qm..." value="QmTest123">
                    </div>
                    <button onclick="simulateRegister()">注册身份 (模拟)</button>
                </div>
                
                <div>
                    <h3>🤝 发起背书</h3>
                    <div class="form-group">
                        <label>从 (发起方)</label>
                        <select id="fromAddress">
                            <option value="5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY">用户 A (5Grwva...)</option>
                            <option value="5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694">用户 B (5FHneW...)</option>
                            <option value="5FLSigC9HGRKVhB9FiEo4Y3koPsNmBmLJbpXg2mp1hXcS59Y">用户 C (5FLSig...)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>到 (目标方)</label>
                        <input type="text" id="targetAddress" placeholder="5..." value="5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694">
                    </div>
                    <div class="form-group">
                        <label>质押金额 (POT)</label>
                        <input type="number" id="feeAmount" value="100">
                    </div>
                    <button onclick="simulateEndorse()">发起背书 (模拟)</button>
                </div>
            </div>
        </div>
        
        <!-- 图谱查询卡片 -->
        <div class="card">
            <h2>🕸️ 知识图谱</h2>
            <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;">
                <button onclick="loadGraph()">🔄 刷新图谱</button>
                <button onclick="loadStats()" class="btn-secondary">📊 刷新统计</button>
                <button onclick="clearDatabase()" style="background:#ef4444;">🗑️ 清空数据</button>
            </div>
            
            <div id="graphStats" class="graph-stats"></div>
            <div id="graphNodes"></div>
            <div id="graphEdges"></div>
            <div id="graphLoading" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>加载图谱数据...</p>
            </div>
        </div>
    </div>
    
    <div id="txStatus" class="tx-status" style="display:none;"></div>
    
    <script>
        const BACKEND_URL = 'http://localhost:3000';
        
        function showTxStatus(message, isError = false) {
            const statusDiv = document.getElementById('txStatus');
            statusDiv.textContent = message;
            statusDiv.style.background = isError ? '#ef4444' : '#10b981';
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 3000);
        }
        
        // 直接调用后端 REST API 添加身份
        async function simulateRegister() {
            const address = document.getElementById('senderAddress').value;
            const cid = document.getElementById('ipfsCid').value;
            
            if (!cid) {
                alert('请输入 IPFS CID');
                return;
            }
            
            showTxStatus('正在注册身份...');
            
            try {
                const response = await fetch(BACKEND_URL + '/add_identity', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        address: address,
                        ipfs_cid: cid
                    })
                });
                
                if (response.ok) {
                    showTxStatus(`✅ 身份注册成功！地址: ${address.substring(0, 16)}...`);
                    loadGraph();
                } else {
                    throw new Error('注册失败');
                }
            } catch (error) {
                showTxStatus(`❌ 注册失败: ${error.message}`, true);
            }
        }
        
        // 发起背书
        async function simulateEndorse() {
            const fromAddr = document.getElementById('fromAddress').value;
            const toAddr = document.getElementById('targetAddress').value;
            const fee = document.getElementById('feeAmount').value;
            
            if (!toAddr) {
                alert('请输入目标地址');
                return;
            }
            
            showTxStatus('正在发起背书...');
            
            try {
                const response = await fetch(BACKEND_URL + '/add_endorsement', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from_address: fromAddr,
                        to_address: toAddr,
                        fee_paid: fee
                    })
                });
                
                if (response.ok) {
                    showTxStatus(`✅ 背书成功！ ${fromAddr.substring(0, 10)}... → ${toAddr.substring(0, 10)}... 质押: ${fee} POT`);
                    loadGraph();
                } else {
                    throw new Error('背书失败');
                }
            } catch (error) {
                showTxStatus(`❌ 背书失败: ${error.message}`, true);
            }
        }
        
        // 从后端加载图谱数据
        async function loadGraph() {
            const loadingDiv = document.getElementById('graphLoading');
            loadingDiv.style.display = 'block';
            
            try {
                const response = await fetch(BACKEND_URL + '/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `{
                            knowledgeGraph {
                                nodes {
                                    address
                                    ipfsCid
                                    inDegree
                                    outDegree
                                    totalScore
                                }
                                edges {
                                    fromAddress
                                    toAddress
                                    feePaid
                                }
                                stats {
                                    totalNodes
                                    totalEdges
                                    maxInDegree
                                    maxOutDegree
                                    highestScoreNode
                                }
                            }
                        }`
                    })
                });
                
                const result = await response.json();
                const data = result.data?.knowledgeGraph;
                
                if (data) {
                    renderStats(data.stats);
                    renderNodes(data.nodes);
                    renderEdges(data.edges);
                } else {
                    document.getElementById('graphStats').innerHTML = '<div class="stat-box">暂无数据，请先注册身份</div>';
                    document.getElementById('graphNodes').innerHTML = '<p>📭 暂无身份节点，请点击"注册身份"创建</p>';
                    document.getElementById('graphEdges').innerHTML = '<p>🔗 暂无信任关系，请发起背书</p>';
                }
                
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('graphStats').innerHTML = '<div style="color:red; background:white; padding:16px; border-radius:8px;">❌ 加载失败，请确保后端服务已启动 (python main.py)</div>';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }
        
        async function loadStats() {
            try {
                const response = await fetch(BACKEND_URL + '/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `{ graphStats { totalNodes totalEdges maxInDegree maxOutDegree highestScoreNode } }`
                    })
                });
                const result = await response.json();
                renderStats(result.data?.graphStats);
            } catch (error) {
                console.error(error);
            }
        }
        
        function renderStats(stats) {
            if (!stats) return;
            document.getElementById('graphStats').innerHTML = `
                <div class="stat-box"><div class="stat-value">${stats.totalNodes || 0}</div><div>总节点数</div></div>
                <div class="stat-box"><div class="stat-value">${stats.totalEdges || 0}</div><div>总关系数</div></div>
                <div class="stat-box"><div class="stat-value">${stats.maxInDegree || 0}</div><div>最大入度</div></div>
                <div class="stat-box"><div class="stat-value">${stats.maxOutDegree || 0}</div><div>最大出度</div></div>
            `;
        }
        
        function renderNodes(nodes) {
            if (!nodes || nodes.length === 0) {
                document.getElementById('graphNodes').innerHTML = '<p>📭 暂无身份节点，请点击"注册身份"创建</p>';
                return;
            }
            
            let html = '<h3>👥 身份节点</h3><div class="node-list">';
            for (const node of nodes) {
                html += `
                    <div class="node-item">
                        <div><strong>📍 地址:</strong> ${node.address.substring(0, 24)}...</div>
                        <div><strong>📄 IPFS:</strong> ${node.ipfsCid}</div>
                        <div><strong>🏆 信任分:</strong> ${node.totalScore}</div>
                        <div><strong>📤 发出:</strong> ${node.outDegree} | <strong>📥 收到:</strong> ${node.inDegree}</div>
                    </div>
                `;
            }
            html += '</div>';
            document.getElementById('graphNodes').innerHTML = html;
        }
        
        function renderEdges(edges) {
            if (!edges || edges.length === 0) {
                document.getElementById('graphEdges').innerHTML = '<p>🔗 暂无信任关系，请发起背书</p>';
                return;
            }
            
            let html = '<h3>🔗 信任关系</h3><div class="edge-list">';
            for (const edge of edges) {
                html += `
                    <div class="edge-item">
                        <div><strong>从:</strong> ${edge.fromAddress.substring(0, 20)}...</div>
                        <div><strong>到:</strong> ${edge.toAddress.substring(0, 20)}...</div>
                        <div><strong>💰 质押:</strong> ${edge.feePaid} POT</div>
                    </div>
                `;
            }
            html += '</div>';
            document.getElementById('graphEdges').innerHTML = html;
        }
        
        async function clearDatabase() {
            if (confirm('⚠️ 确定要清空所有数据吗？此操作不可恢复！')) {
                try {
                    await fetch(BACKEND_URL + '/clear_data', { method: 'POST' });
                    showTxStatus('数据已清空');
                    loadGraph();
                } catch (error) {
                    showTxStatus('清空失败', true);
                }
            }
        }
        
        // 页面加载时自动加载图谱
        document.addEventListener('DOMContentLoaded', () => {
            loadGraph();
            setInterval(loadGraph, 30000);
        });
    </script>
</body>
</html>
