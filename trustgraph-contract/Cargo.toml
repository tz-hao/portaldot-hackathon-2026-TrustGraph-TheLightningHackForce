[package]
name = "trustgraph"
version = "0.1.0"
description = "TrustGraph smart contract implemented with ink!"
edition = "2021"

[dependencies]
ink = { version = "5.1.1", default-features = false }
scale = { version = "3", package = "parity-scale-codec", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
ink_e2e = { version = "5.1.1" }

[lib]
path = "trustgraph.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
]
ink-as-dependency = []
e2e-tests = []
scale-info = ["dep:scale-info"]
